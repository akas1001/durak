<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Кошачьи Гонки</title>
<style>
:root{--pink:#ff6fae;--plum:#5b2346}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--plum);background:#a8dc8f}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;z-index:1}
#sakura{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.petal{position:absolute;top:-40px;left:0;animation:fall linear infinite}
.petal i{display:block;width:18px;height:14px;background:linear-gradient(135deg,#fff,#ff9fc6 70%);border-radius:150% 0 150% 0;
box-shadow:0 1px 3px rgba(168,50,106,.35);animation:spin ease-in-out infinite alternate}
@keyframes fall{0%{transform:translate(0,0)}25%{transform:translate(40px,27vh)}50%{transform:translate(-20px,54vh)}75%{transform:translate(35px,80vh)}100%{transform:translate(-10px,112vh)}}
@keyframes spin{0%{transform:rotate(0) rotateX(0) scale(var(--s))}100%{transform:rotate(320deg) rotateX(70deg) scale(var(--s))}}
#hud{position:fixed;top:0;left:0;right:0;z-index:3;display:none;gap:18px;padding:10px 14px;pointer-events:none;color:#fff;font-weight:bold;text-shadow:2px 2px 0 #a8326a}
#hud .big{font-size:28px;line-height:1}#hud .lbl{font-size:12px;opacity:.95}
#ui{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(201,95,143,.35)}
#ui.hide{display:none}
.panel{background:rgba(255,255,255,.92);border:3px solid #fff;border-radius:24px;padding:20px;max-width:390px;width:100%;text-align:center;
box-shadow:0 8px 24px rgba(168,50,106,.3);display:flex;flex-direction:column;gap:12px;align-items:center}
h1{margin:0;font-size:28px;color:#d63384}
.kits{display:flex;gap:6px;align-items:flex-end}.kits svg{width:90px;height:90px}.kits svg.dog{width:70px;height:70px}
button{font:inherit;font-weight:bold;border:0;border-radius:999px;padding:12px 22px;background:var(--pink);color:#fff;box-shadow:0 4px 0 #d63384;cursor:pointer;width:100%}
button.alt{background:#fff;color:#d63384;box-shadow:0 4px 0 #f3a7c8;border:2px solid #ffc2dc}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #d63384}
input{font:inherit;width:100%;padding:10px;border-radius:12px;border:2px solid #ffc2dc;text-align:center}
.small{font-size:14px;opacity:.85}
.res{font-size:40px;font-weight:bold;color:#d63384}
kbd{background:#ffe3f0;border-radius:6px;padding:1px 6px;border:1px solid #ffc2dc}
#count{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;font-size:110px;font-weight:bold;color:#fff;text-shadow:4px 4px 0 #a8326a;pointer-events:none}
#toast{position:fixed;left:0;right:0;top:28%;z-index:6;text-align:center;font-size:34px;font-weight:bold;color:#fff;text-shadow:3px 3px 0 #1d3a9e;pointer-events:none;opacity:0;transition:opacity .2s}
#snd{position:fixed;right:12px;top:12px;z-index:8;width:44px;height:44px;padding:0;font-size:20px;border-radius:50%}
#pad{position:fixed;left:0;right:0;bottom:0;z-index:3;display:none;justify-content:space-between;padding:14px;pointer-events:none}
#pad .grp{display:flex;gap:12px;pointer-events:auto}
#pad .grp.v{flex-direction:column}
#pad b{width:74px;height:74px;border-radius:22px;background:rgba(255,255,255,.75);border:3px solid #fff;display:flex;align-items:center;justify-content:center;
font-size:32px;color:#d63384;box-shadow:0 4px 0 rgba(214,51,132,.5);touch-action:none}
#pad b.on{background:#ff6fae;color:#fff}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="sakura"></div>
<div id="hud"><div><div class="lbl">Круг</div><div class="big" id="lap">1/3</div></div>
<div><div class="lbl">Место</div><div class="big" id="place">1</div></div>
<div><div class="lbl">Время</div><div class="big" id="time">0.0</div></div></div>
<div id="count"></div><div id="toast"></div>
<div id="pad"><div class="grp"><b data-k="left">◀</b><b data-k="right">▶</b></div><div class="grp v"><b data-k="up">▲</b><b data-k="down">▼</b></div></div>
<div id="ui"></div>
<button id="snd" aria-label="Звук">🔊</button>
<script>
/* ================= картинки ================= */
function kittySVG(cls='',fur='#ffb36b',stripe='#e57f34'){return `<svg class="${cls}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<path d="M18 48 L24 8 L48 30Z" fill="${fur}" stroke="#5b2346" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M82 48 L76 8 L52 30Z" fill="${fur}" stroke="#5b2346" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M26 36 L28 18 L40 30Z" fill="#ffb3c7"/><path d="M74 36 L72 18 L60 30Z" fill="#ffb3c7"/>
<ellipse cx="50" cy="57" rx="40" ry="33" fill="${fur}" stroke="#5b2346" stroke-width="2.5"/>
<path d="M44 26 Q45 33 43 38 M50 25 L50 37 M56 26 Q55 33 57 38" stroke="${stripe}" stroke-width="3.5" stroke-linecap="round" fill="none"/>
<path d="M12 56 Q19 55 22 59 M88 56 Q81 55 78 59" stroke="${stripe}" stroke-width="3" stroke-linecap="round" fill="none"/>
<ellipse cx="50" cy="73" rx="17" ry="12" fill="#fff1e3"/>
<ellipse cx="34" cy="55" rx="8" ry="9.5" fill="#3a1c33"/><ellipse cx="66" cy="55" rx="8" ry="9.5" fill="#3a1c33"/>
<circle cx="37" cy="51" r="3.2" fill="#fff"/><circle cx="69" cy="51" r="3.2" fill="#fff"/>
<ellipse cx="22" cy="67" rx="6" ry="3.5" fill="#ff8fb3" opacity=".7"/><ellipse cx="78" cy="67" rx="6" ry="3.5" fill="#ff8fb3" opacity=".7"/>
<path d="M46.5 65 L53.5 65 L50 69Z" fill="#ff6f9c" stroke="#5b2346" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M43 71 Q46.5 76 50 71 Q53.5 76 57 71" stroke="#5b2346" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M6 64 L28 68 M6 74 L28 72 M94 64 L72 68 M94 74 L72 72" stroke="#5b2346" stroke-width="1.5" stroke-linecap="round"/>
</svg>`}
function dogSVG(cls=''){return `<svg class="${cls}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="17" cy="56" rx="12" ry="22" fill="#8a5a3c" stroke="#3a2418" stroke-width="2.5" transform="rotate(18 17 56)"/>
<ellipse cx="83" cy="56" rx="12" ry="22" fill="#8a5a3c" stroke="#3a2418" stroke-width="2.5" transform="rotate(-18 83 56)"/>
<ellipse cx="50" cy="58" rx="33" ry="31" fill="#e8c391" stroke="#3a2418" stroke-width="2.5"/>
<ellipse cx="50" cy="73" rx="17" ry="12" fill="#fff4e3"/>
<circle cx="37" cy="56" r="5.5" fill="#2a1a12"/><circle cx="63" cy="56" r="5.5" fill="#2a1a12"/>
<circle cx="39" cy="54" r="2" fill="#fff"/><circle cx="65" cy="54" r="2" fill="#fff"/>
<ellipse cx="50" cy="67" rx="7" ry="5" fill="#2a1a12"/>
<path d="M44 74 Q50 79 56 74" stroke="#2a1a12" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M47 76 Q50 86 53 76Z" fill="#ff7a9a" stroke="#2a1a12" stroke-width="1.2"/>
<path d="M18 36 Q50 2 82 36Z" fill="#2747b8" stroke="#13235e" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="14" y="33" width="72" height="9" rx="4" fill="#13235e"/>
<path d="M50 14 L53 21 L60 21 L54.5 25.5 L56.5 32 L50 28 L43.5 32 L45.5 25.5 L40 21 L47 21Z" fill="#ffc93c" stroke="#a87b00" stroke-width="1"/>
</svg>`}
function img(svg){const i=new Image();i.src='data:image/svg+xml,'+encodeURIComponent(svg);return i}
const IMG={orange:img(kittySVG()),grey:img(kittySVG('','#c9c9d6','#8d8da3')),dog:img(dogSVG())};
(function petals(){let h='';for(let i=0;i<26;i++){const d=8+Math.random()*9;
  h+=`<div class="petal" style="left:${Math.random()*100}%;animation-duration:${d}s;animation-delay:${-Math.random()*d}s"><i style="--s:${.6+Math.random()*.8};animation-duration:${1.5+Math.random()*2.5}s"></i></div>`}
  document.getElementById('sakura').innerHTML=h})();

/* ================= звук ================= */
let AC=null,master,musicGain,noiseBuf,musicIv=null,step=0,nextT=0,engine=null,siren=null;
let muted=(()=>{try{return localStorage.getItem('kr_mute')==='1'}catch{return false}})();
function audio(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
    master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=.16;musicGain.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume();return AC}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,dur,type='square',vol=.15,dest=master,f2=null){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02)}
function noise(t,dur,ftype,f1,f2,vol,dest=master,q=1){const n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();n.buffer=noiseBuf;
  f.type=ftype;f.Q.value=q;f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(f);f.connect(g);g.connect(dest);n.start(t);n.stop(t+dur+.02)}
function sfxBark(){if(!audio())return;const t=AC.currentTime;tone(520,t,.12,'square',.25,master,260);tone(560,t+.17,.14,'square',.25,master,240);noise(t,.1,'bandpass',1200,500,.3)}
function sfxBeep(hi){if(!audio())return;tone(hi?1320:660,AC.currentTime,hi?.35:.15,'square',.12)}
function sfxLap(){if(!audio())return;const t=AC.currentTime;[76,79,84].forEach((m,i)=>tone(mf(m),t+i*.08,.16,'triangle',.25))}
function sfxEnd(win){if(!audio())return;const t=AC.currentTime;(win?[72,76,79,84]:[72,67,64,60]).forEach((m,i)=>tone(mf(m),t+i*.13,.25,'square',.13))}
function startLoops(){
  if(!audio()||engine)return;
  const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=60;f.type='lowpass';f.frequency.value=700;g.gain.value=0;
  o.connect(f);f.connect(g);g.connect(master);o.start();engine={o,g};
  const s=AC.createOscillator(),sg=AC.createGain();s.type='triangle';s.frequency.value=700;sg.gain.value=0;s.connect(sg);sg.connect(master);s.start();siren={o:s,g:sg}}
function updateLoops(speed01,racing,dogDist){
  if(!engine)return;const t=AC.currentTime;
  engine.o.frequency.setTargetAtTime(55+speed01*150,t,.05);engine.g.gain.setTargetAtTime(racing?.05+speed01*.05:0,t,.1);
  siren.o.frequency.setTargetAtTime(Math.floor(performance.now()/420)%2?950:700,t,.02);
  siren.g.gain.setTargetAtTime(racing?Math.max(0,1-dogDist/700)*.07:0,t,.1)}
const MEL=[72,null,76,79,76,null,72,74, 76,null,79,81,79,76,74,null, 77,null,81,84,81,77,76,74, 79,null,74,76,79,83,84,null];
const BASS=[48,45,41,43];
function startMusic(){if(!audio()||musicIv)return;nextT=AC.currentTime+.05;step=0;
  musicIv=setInterval(()=>{const sd=60/(mode==='race'&&me.lap===LAPS-1?172:152)/2;
    while(nextT<AC.currentTime+.12){const i=step%32,m=MEL[i],b=BASS[(i/8|0)];
      if(m)tone(mf(m),nextT,sd*.9,'square',.11,musicGain);
      tone(mf(b+(i%2?12:0)),nextT,sd*.8,'triangle',.28,musicGain);
      noise(nextT,.04,'highpass',7000,6000,i%2?.06:.12,musicGain);
      if(i%4===2)noise(nextT,.09,'bandpass',1800,900,.18,musicGain,1);
      nextT+=sd;step++}},25)}
function setMute(v){muted=v;try{localStorage.setItem('kr_mute',v?'1':'0')}catch{}if(master)master.gain.value=v?0:.8;document.getElementById('snd').textContent=v?'🔇':'🔊'}

/* ================= трасса ================= */
const LAPS=3,TW=210,WORLD_W=2600,WORLD_H=1750;
const CTRL=[[320,820],[420,360],[900,210],[1400,420],[1720,250],[2180,360],[2290,820],[2020,1200],[1520,1080],[1260,1420],[700,1460],[360,1230]];
const TR=[];(function(){const n=CTRL.length,K=32;
  for(let i=0;i<n;i++){const p0=CTRL[(i-1+n)%n],p1=CTRL[i],p2=CTRL[(i+1)%n],p3=CTRL[(i+2)%n];
    for(let k=0;k<K;k++){const t=k/K,t2=t*t,t3=t2*t;
      const f=(a,b,c,d)=>.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      TR.push({x:f(p0[0],p1[0],p2[0],p3[0]),y:f(p0[1],p1[1],p2[1],p3[1])})}}
  for(let i=0;i<TR.length;i++){const a=TR[i],b=TR[(i+1)%TR.length];a.a=Math.atan2(b.y-a.y,b.x-a.x)}})();
const N=TR.length;
function nearest(x,y,hint){let best=hint,bd=1e18;const range=hint==null?N:26;
  for(let k=-range;k<=range;k++){const i=hint==null?(k+N)%N:((hint+k)%N+N)%N;const d=(TR[i].x-x)**2+(TR[i].y-y)**2;if(d<bd){bd=d;best=i}}
  return{i:best,d:Math.sqrt(bd)}}
// заранее рисуем трассу
const trackCv=document.createElement('canvas');trackCv.width=WORLD_W;trackCv.height=WORLD_H;
const miniCv=document.createElement('canvas');miniCv.width=150;miniCv.height=101;
(function drawTrack(){const c=trackCv.getContext('2d');
  c.fillStyle='#a8dc8f';c.fillRect(0,0,WORLD_W,WORLD_H);
  for(let i=0;i<900;i++){c.fillStyle=i%3?'#9bd383':'#b6e59e';c.beginPath();c.arc(Math.random()*WORLD_W,Math.random()*WORLD_H,4+Math.random()*10,0,7);c.fill()}
  const path=()=>{c.beginPath();c.moveTo(TR[0].x,TR[0].y);for(const p of TR)c.lineTo(p.x,p.y);c.closePath()};
  c.lineJoin='round';c.lineCap='round';
  path();c.lineWidth=TW+22;c.strokeStyle='#fff';c.stroke();
  c.setLineDash([26,26]);c.strokeStyle='#ff5c8a';c.stroke();c.setLineDash([]);
  path();c.lineWidth=TW;c.strokeStyle='#7d7f8f';c.stroke();
  path();c.lineWidth=4;c.strokeStyle='rgba(255,255,255,.75)';c.setLineDash([30,30]);c.stroke();c.setLineDash([]);
  // старт/финиш в клеточку
  const s=TR[0],nx=-Math.sin(s.a),ny=Math.cos(s.a);c.save();c.translate(s.x,s.y);c.rotate(s.a);
  for(let r=0;r<2;r++)for(let k=0;k<14;k++){c.fillStyle=(k+r)%2?'#222':'#fff';c.fillRect(r*15-15,-TW/2+k*TW/14,15,TW/14)}c.restore();
  // декор
  let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
  c.font='44px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui';c.textAlign='center';c.textBaseline='middle';
  const deco=['🌸','🌳','🌷','🍓','🌼','🌲','🏡','🌸','🍄'];
  for(let i=0;i<160;i++){const x=40+R()*(WORLD_W-80),y=40+R()*(WORLD_H-80);if(nearest(x,y).d<TW/2+50)continue;
    const e=deco[R()*deco.length|0];c.font=(e==='🏡'||e==='🌳'||e==='🌲'?70:40)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui';c.fillText(e,x,y)}
  const m=miniCv.getContext('2d'),sc=150/WORLD_W;m.fillStyle='rgba(255,255,255,.55)';m.beginPath();m.roundRect?m.roundRect(0,0,150,101,12):m.rect(0,0,150,101);m.fill();
  m.beginPath();m.moveTo(TR[0].x*sc,TR[0].y*sc);for(const p of TR)m.lineTo(p.x*sc,p.y*sc);m.closePath();m.lineWidth=5;m.strokeStyle='#7d7f8f';m.stroke()})();

/* ================= игра ================= */
const MAXV=540,ACC=400,BRAKE=750,FRIC=240,STEER=2.9,DOGV=475,CATCH=48;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W,H,DPR,ZOOM;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ZOOM=Math.max(.5,Math.min(1.15,Math.min(W,H)/680))}
addEventListener('resize',resize);resize();

let mode='menu',duel=false,isHost=false,code='',ws=null,guestHere=false,wins=[0,0];
let me,opp,dogs=[],startT=0,keys={up:0,down:0,left:0,right:0},sendT=0,toastT=0,myFin=null,oppFin=null,raceOverShown=false;
function newCat(lane){const s=TR[N-4],nx=-Math.sin(s.a),ny=Math.cos(s.a);
  return{x:s.x+nx*lane*55,y:s.y+ny*lane*55,a:s.a,v:0,lap:0,idx:N-4,cp:false,stun:0,spin:0}}
function initRace(){
  me=newCat(isHost||!duel?-1:1);opp=duel?Object.assign(newCat(isHost?1:-1),{tx:0,ty:0,ta:0,seen:false}):null;if(opp){opp.tx=opp.x;opp.ty=opp.y;opp.ta=opp.a}
  dogs=[0,1,2].map(k=>{const i=(N-24-k*10+N)%N,s=TR[i],l=[-.5,.5,0][k],nx=-Math.sin(s.a),ny=Math.cos(s.a);
    return{x:s.x+nx*l*80,y:s.y+ny*l*80,a:s.a,idx:i,cool:0,tx:0,ty:0}});
  myFin=null;oppFin=null;raceOverShown=false;
}
function begin(){
  audio();startMusic();startLoops();initRace();hideUI();
  document.getElementById('hud').style.display='flex';document.getElementById('sakura').style.display='none';
  if(matchMedia('(pointer:coarse)').matches)document.getElementById('pad').style.display='flex';
  mode='count';const c=document.getElementById('count');c.style.display='flex';let n=3;c.textContent=n;sfxBeep(false);
  const iv=setInterval(()=>{n--;if(n>0){c.textContent=n;sfxBeep(false)}else{clearInterval(iv);c.textContent='Газ!';sfxBeep(true);
    setTimeout(()=>c.style.display='none',600);mode='race';startT=performance.now()}},850)}
function toast(t,ms=1200){const el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;toastT=performance.now()+ms}
const prog=c=>c.lap*N+((c.idx-(N-4)+N)%N)+(c.cp&&c.idx<N/2?N:0);

function stepCat(c,dt,ctl){
  if(c.stun>0){c.stun-=dt;c.spin+=dt*14;c.v*=.9;}
  else{c.spin=0;
    if(ctl.up)c.v+=ACC*dt;else if(ctl.down)c.v-=(c.v>0?BRAKE:ACC*.6)*dt;
    else c.v-=Math.sign(c.v)*Math.min(Math.abs(c.v),FRIC*dt);
    const turn=(ctl.right?1:0)-(ctl.left?1:0);c.a+=turn*STEER*dt*Math.max(-1,Math.min(1,c.v/180));}
  const n=nearest(c.x,c.y,c.idx);c.idx=n.i;
  const off=n.d>TW/2,maxv=off?MAXV*.45:MAXV;
  if(c.v>maxv)c.v-=(off?900:400)*dt;if(c.v<-MAXV*.35)c.v=-MAXV*.35;
  c.x+=Math.cos(c.a)*c.v*dt;c.y+=Math.sin(c.a)*c.v*dt;
  c.x=Math.max(20,Math.min(WORLD_W-20,c.x));c.y=Math.max(20,Math.min(WORLD_H-20,c.y));
  const prev=c.lastIdx??c.idx;
  if(c.idx>N*.4&&c.idx<N*.6)c.cp=true;
  c.lastIdx=c.idx;
  if(prev>N*.85&&c.idx<N*.15&&c.cp){c.lap++;c.cp=false;return'lap'}}

function stepDogs(dt,el){
  const cats=[me];if(opp&&opp.seen)cats.push(opp);
  dogs.forEach((d,k)=>{
    if(el<2.5+k*.6)return;
    if(d.cool>0){d.cool-=dt;return}
    let tgt=null,td=1e9;for(const c of cats){if(c.finished)continue;const dd=Math.hypot(c.x-d.x,c.y-d.y);if(dd<td){td=dd;tgt=c}}
    const n=nearest(d.x,d.y,d.idx);d.idx=n.i;
    let gx,gy;if(tgt&&td<430){gx=tgt.x;gy=tgt.y}else{const t=TR[(d.idx+9)%N];gx=t.x;gy=t.y}
    let want=Math.atan2(gy-d.y,gx-d.x),da=((want-d.a+Math.PI*3)%(Math.PI*2))-Math.PI;d.a+=Math.max(-4.5*dt,Math.min(4.5*dt,da));
    const sp=td>900?MAXV*1.12:DOGV;
    d.x+=Math.cos(d.a)*sp*dt;d.y+=Math.sin(d.a)*sp*dt;
    if(td<CATCH&&tgt&&tgt.stun<=0){d.cool=2;
      if(tgt===me)caught(k);else if(tgt===opp)net({t:'gotcha',dog:k});}
  })}
function caught(k){if(me.stun>0)return;me.stun=1.3;me.v=0;sfxBark();toast('Гав! Поймали! 🚓');if(duel&&!isHost)net({t:'caught',dog:k})}

let prevT=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-prevT)/1000);prevT=now;
  const el=mode==='race'?(now-startT)/1000:0;
  if(mode==='race'&&me){
    if(!myFin){if(stepCat(me,dt,keys)==='lap'){if(me.lap>=LAPS)finish(el);else{sfxLap();toast(me.lap===LAPS-1?'Последний круг! 🔥':`Круг ${me.lap+1}!`)}}}
    else stepCat(me,dt,{});
    if(!duel||isHost)stepDogs(dt,el);
    else for(const d of dogs){d.x+=(d.tx-d.x)*Math.min(1,dt*12);d.y+=(d.ty-d.y)*Math.min(1,dt*12);
      if(d.cool<=0&&Math.hypot(d.x-me.x,d.y-me.y)<CATCH&&me.stun<=0&&!myFin)caught(dogs.indexOf(d))}
    if(opp){opp.x+=(opp.tx-opp.x)*Math.min(1,dt*12);opp.y+=(opp.ty-opp.y)*Math.min(1,dt*12);
      let da=((opp.ta-opp.a+Math.PI*3)%(Math.PI*2))-Math.PI;opp.a+=da*Math.min(1,dt*12)}
    sendT-=dt;if(duel&&sendT<=0){sendT=.05;net({t:'pos',x:me.x|0,y:me.y|0,a:+me.a.toFixed(3),lap:me.lap,idx:me.idx,cp:me.cp,stun:me.stun>0?1:0});
      if(isHost)net({t:'dogs',d:dogs.map(d=>[d.x|0,d.y|0,+d.a.toFixed(2)])})}
    document.getElementById('lap').textContent=`${Math.min(LAPS,me.lap+1)}/${LAPS}`;
    document.getElementById('time').textContent=(myFin??el).toFixed(1);
    let place=1;if(opp&&opp.seen){if(oppFin!=null&&myFin==null)place=2;else if(myFin==null&&prog(opp)>prog(me))place=2;else if(myFin!=null&&oppFin!=null&&oppFin<myFin)place=2}
    document.getElementById('place').textContent=duel?place:'—';
    const dd=Math.min(...dogs.map(d=>Math.hypot(d.x-me.x,d.y-me.y)));updateLoops(Math.abs(me.v)/MAXV,!myFin,dd);
  }else updateLoops(0,false,1e9);
  if(performance.now()>toastT)document.getElementById('toast').style.opacity=0;
  draw(now);requestAnimationFrame(loop)}

function drawKart(c,imgCat,col,label,now){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a+c.spin);
  ctx.fillStyle='#222';for(const [x,y] of[[-18,-21],[14,-21],[-18,15],[14,15]])ctx.fillRect(x,y,12,7);
  ctx.fillStyle=col;ctx.strokeStyle='#5b2346';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect?ctx.roundRect(-28,-17,58,34,12):ctx.rect(-28,-17,58,34);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(18,-10,8,20);ctx.restore();
  if(imgCat.complete)ctx.drawImage(imgCat,c.x-26,c.y-34,52,52);
  if(label){ctx.font='bold 16px "Trebuchet MS",system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText(label,c.x,c.y-40);ctx.fillStyle='#d63384';ctx.fillText(label,c.x,c.y-40)}}
function drawDog(d,now,k){
  ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.a);ctx.fillStyle='#fff';ctx.strokeStyle='#13235e';ctx.lineWidth=3;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(-26,-16,54,32,10):ctx.rect(-26,-16,54,32);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2747b8';ctx.fillRect(-26,-4,54,8);ctx.restore();
  if(IMG.dog.complete)ctx.drawImage(IMG.dog,d.x-25,d.y-36,50,50);
  const on=Math.floor(now/200+k)%2;ctx.fillStyle=on?'#ff2b4a':'#2b6bff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=22;
  ctx.beginPath();ctx.arc(d.x,d.y-44,7,0,7);ctx.fill();ctx.shadowBlur=0;
  if(d.cool>1.3){ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#13235e';ctx.lineWidth=4;ctx.strokeText('ГАВ!',d.x,d.y-58);ctx.fillText('ГАВ!',d.x,d.y-58)}}
function draw(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#a8dc8f';ctx.fillRect(0,0,W,H);
  const f=me||{x:TR[0].x,y:TR[0].y};
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(ZOOM,ZOOM);ctx.translate(-f.x,-f.y);
  ctx.drawImage(trackCv,0,0);
  if(me){for(let k=0;k<dogs.length;k++)drawDog(dogs[k],now,k);
    if(opp&&opp.seen)drawKart(opp,isHost?IMG.grey:IMG.orange,isHost?'#b7b7cc':'#ffb36b','Друг',now);
    drawKart(me,(isHost||!duel)?IMG.orange:IMG.grey,(isHost||!duel)?'#ffb36b':'#b7b7cc',duel?'Ты':'',now)}
  ctx.restore();
  if(me&&mode!=='menu'){const sc=150/WORLD_W,ox=W-162,oy=64;ctx.drawImage(miniCv,ox,oy);
    const dot=(x,y,c,r=5)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(ox+x*sc,oy+y*sc,r,0,7);ctx.fill()};
    for(const d of dogs)dot(d.x,d.y,Math.floor(now/200)%2?'#ff2b4a':'#2b6bff',4);
    if(opp&&opp.seen)dot(opp.x,opp.y,'#8d8da3');dot(me.x,me.y,'#ff6fae',6)}}
requestAnimationFrame(loop);

function finish(t){myFin=t;me.finished=true;if(duel)net({t:'fin',time:t});showResult()}
function showResult(){
  if(myFin==null)return;
  const best=(()=>{try{return+localStorage.getItem('kr_best')||0}catch{return 0}})(),rec=!best||myFin<best;
  if(!duel){if(rec)try{localStorage.setItem('kr_best',myFin.toFixed(2))}catch{}
    if(!raceOverShown){raceOverShown=true;sfxEnd(true)}
    setTimeout(()=>{mode='over';showUI(`<div class="kits">${kittySVG()}</div><h1>Финиш! 🏁</h1><div class="res">${myFin.toFixed(1)} c</div>
     <div class="small">${rec?'Новый рекорд! 🎉':'Рекорд: '+best.toFixed(1)+' c'}</div><button id="again">Ещё заезд</button><button class="alt" id="back">В меню</button>`);
     document.getElementById('again').onclick=begin;document.getElementById('back').onclick=menu},900);return}
  const won=oppFin==null||myFin<oppFin;
  if(!raceOverShown){raceOverShown=true;sfxEnd(won);if(oppFin!=null||won){}}
  if(oppFin==null){showUI(`<div class="kits">${kittySVG('',isHost?'#ffb36b':'#c9c9d6',isHost?'#e57f34':'#8d8da3')}</div><h1>Ты первый! 🏆</h1><div class="res">${myFin.toFixed(1)} c</div><div class="small">Ждём, пока друг доедет…</div>`);return}
  finalDuel()}
function finalDuel(){
  if(myFin==null||oppFin==null||finalDuel.done)return;finalDuel.done=true;mode='over';
  const won=myFin<oppFin;wins[won?0:1]++;
  showUI(`<div class="kits">${kittySVG()}${kittySVG('','#c9c9d6','#8d8da3')}</div><h1>${won?'Ты победил! 🏆':'Друг победил 😿'}</h1>
   <div class="small">Ты: <b>${myFin.toFixed(1)} c</b> · Друг: <b>${oppFin.toFixed(1)} c</b></div>
   <div class="small">Счёт серии: <b>${wins[0]} : ${wins[1]}</b></div><button id="re">Реванш 🏁</button><button class="alt" id="back">Выйти</button>`);
  document.getElementById('re').onclick=()=>{if(isHost)startDuel();else{net({t:'rematch'});document.getElementById('re').textContent='Ждём друга…'}};
  document.getElementById('back').onclick=()=>location.href=location.pathname}

/* ================= управление ================= */
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k){keys[k]=1;e.preventDefault();audio()}});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){keys[k]=0;e.preventDefault()}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
document.querySelectorAll('#pad b').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on');audio()},off=e=>{e.preventDefault();keys[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});

/* ================= экраны ================= */
const ui=document.getElementById('ui');
function showUI(html){ui.innerHTML=`<div class="panel">${html}</div>`;ui.classList.remove('hide')}
function hideUI(){ui.classList.add('hide')}
function menu(){mode='menu';me=null;document.getElementById('hud').style.display='none';document.getElementById('pad').style.display='none';document.getElementById('sakura').style.display='';
  showUI(`<div class="kits">${kittySVG()}${dogSVG('dog')}</div><h1>Кошачьи Гонки</h1>
  <div class="small">Газ <kbd>↑</kbd> тормоз <kbd>↓</kbd> руль <kbd>←</kbd> <kbd>→</kbd>. На телефоне кнопки на экране.<br>3 круга. Не попадись полицейским собачкам! 🚓</div>
  <button id="duel">🏁 Гонка с другом</button><button class="alt" id="solo">🐱 Покататься одному</button>`);
  document.getElementById('solo').onclick=()=>{duel=false;isHost=false;begin()};
  document.getElementById('duel').onclick=hostDuel}
function startDuel(){finalDuel.done=false;net({t:'start'});begin()}

/* ================= сеть ================= */
function net(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(role,onOpen){
  ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws?room='+code+'&role='+role);
  ws.onopen=onOpen;
  ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}
    if((d.t==='join'||d.t==='hello')&&isHost){guestHere=true;if(mode==='menu'||mode==='wait')hostReady()}
    else if(d.t==='start'&&!isHost){finalDuel.done=false;begin()}
    else if(d.t==='pos'&&opp){Object.assign(opp,{tx:d.x,ty:d.y,ta:d.a,lap:d.lap,idx:d.idx,cp:d.cp});opp.stun=d.stun?1:0;
      if(!opp.seen){opp.seen=true;opp.x=d.x;opp.y=d.y;opp.a=d.a}}
    else if(d.t==='dogs'&&!isHost)d.d.forEach((v,i)=>{if(dogs[i]){dogs[i].tx=v[0];dogs[i].ty=v[1];dogs[i].a=v[2]}})
    else if(d.t==='caught'&&isHost&&dogs[d.dog])dogs[d.dog].cool=2
    else if(d.t==='gotcha'&&!isHost&&me&&!myFin){dogs[d.dog]&&(dogs[d.dog].cool=2);caught(d.dog)}
    else if(d.t==='fin'){oppFin=d.time;if(opp)opp.finished=true;if(myFin==null)toast('Друг уже финишировал! 😱',1600);else{showResult()}}
    else if(d.t==='rematch'&&isHost&&mode==='over')startDuel()
    else if(d.t==='left'){mode='menu';showUI(`<div class="kits">${kittySVG()}</div><h1>Друг вышел 💔</h1><button onclick="location.href=location.pathname">В меню</button>`)}};
  ws.onerror=()=>showUI(`<div class="kits">${kittySVG()}</div><div>Нет связи с сервером 😿</div><button onclick="location.reload()">Обновить</button>`);
  setInterval(()=>net({t:'ping'}),25000)}
function hostDuel(){duel=true;isHost=true;code=Math.random().toString(36).slice(2,8);history.replaceState(null,'','#'+code);mode='wait';audio();startMusic();
  connect('host',()=>{const link=location.href;
    showUI(`<div class="kits">${kittySVG()}${kittySVG('','#c9c9d6','#8d8da3')}</div><h1>Гонка с другом</h1><div class="small">Отправь другу ссылку:</div><input id="lnk" readonly value="${link}">
    <button id="cp">Скопировать</button>${navigator.share?'<button class="alt" id="sh">Поделиться</button>':''}<div class="small">Ждём друга… ✨</div>`);
    document.getElementById('cp').onclick=()=>{document.getElementById('lnk').select();navigator.clipboard?.writeText(link);document.getElementById('cp').textContent='Скопировано 💗'};
    const sh=document.getElementById('sh');if(sh)sh.onclick=()=>navigator.share({title:'Погоняем на кисках? 🏁',url:link});
    if(guestHere)hostReady()})}
function hostReady(){showUI(`<div class="kits">${kittySVG()}${kittySVG('','#c9c9d6','#8d8da3')}</div><h1>Друг здесь! 🎉</h1>
  <div class="small">Ты рыжая киса, друг серый. 3 круга, за вами гонятся собачки-полицейские!</div><button id="go">Старт! 🏁</button>`);
  document.getElementById('go').onclick=startDuel}
function joinDuel(c){duel=true;isHost=false;code=c;mode='wait';showUI(`<div class="kits">${kittySVG('','#c9c9d6','#8d8da3')}</div><div>Подключаюсь…</div>`);
  connect('guest',()=>{net({t:'hello'});showUI(`<div class="kits">${kittySVG('','#c9c9d6','#8d8da3')}${dogSVG('dog')}</div><h1>Ты в гонке! 🏁</h1>
   <div class="small">Ты серая киса. Газ <kbd>↑</kbd> тормоз <kbd>↓</kbd> руль <kbd>←</kbd> <kbd>→</kbd>.<br>Ждём, пока друг нажмёт «Старт».</div><button class="alt" id="snd2">🔊 Включить звук</button>`);
   document.getElementById('snd2').onclick=e=>{audio();startMusic();e.target.textContent='Звук включён ✅'}})}

document.getElementById('snd').onclick=()=>{audio();startMusic();setMute(!muted)};setMute(muted);
const h=location.hash.slice(1);
if(/^[a-z0-9]{4,12}$/.test(h))joinDuel(h);else menu();
</script>
</body>
</html>
