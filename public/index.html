<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Кошачий Фрукторез</title>
<style>
:root{--pink:#ff6fae;--plum:#5b2346}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--plum);background:linear-gradient(160deg,#f3a7c8,#c95f8f) fixed;background-color:#e58cb2}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;z-index:3}
#sakura{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.petal{position:absolute;top:-40px;left:0;animation:fall linear infinite}
.petal i{display:block;width:18px;height:14px;background:linear-gradient(135deg,#fff,#ff9fc6 70%);border-radius:150% 0 150% 0;
box-shadow:0 1px 3px rgba(168,50,106,.35);animation:spin ease-in-out infinite alternate}
@keyframes fall{0%{transform:translate(0,0)}25%{transform:translate(40px,27vh)}50%{transform:translate(-20px,54vh)}75%{transform:translate(35px,80vh)}100%{transform:translate(-10px,112vh)}}
@keyframes spin{0%{transform:rotate(0) rotateX(0) scale(var(--s))}100%{transform:rotate(320deg) rotateX(70deg) scale(var(--s))}}
#hud{position:fixed;top:0;left:0;right:0;z-index:4;display:none;justify-content:space-between;align-items:flex-start;padding:10px 14px;pointer-events:none;
color:#fff;font-weight:bold;text-shadow:2px 2px 0 #a8326a}
#hud .big{font-size:34px;line-height:1}#hud .lbl{font-size:13px;opacity:.9}
#hud .mid{text-align:center}#hud .r{text-align:right}
#ui{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px}
#ui.hide{display:none}
.panel{background:rgba(255,255,255,.88);border:3px solid #fff;border-radius:24px;padding:20px;max-width:380px;width:100%;text-align:center;
box-shadow:0 8px 24px rgba(168,50,106,.3);display:flex;flex-direction:column;gap:12px;align-items:center}
h1{margin:0;font-size:28px;color:#d63384}
.kit{width:120px;height:120px}
button{font:inherit;font-weight:bold;border:0;border-radius:999px;padding:12px 22px;background:var(--pink);color:#fff;box-shadow:0 4px 0 #d63384;cursor:pointer;width:100%}
button.alt{background:#fff;color:#d63384;box-shadow:0 4px 0 #f3a7c8;border:2px solid #ffc2dc}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #d63384}
input{font:inherit;width:100%;padding:10px;border-radius:12px;border:2px solid #ffc2dc;text-align:center}
.small{font-size:14px;opacity:.85}
.res{font-size:46px;font-weight:bold;color:#d63384}
.vs{display:flex;justify-content:space-around;width:100%;font-weight:bold}
.vs div{font-size:30px}
#count{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:bold;color:#fff;text-shadow:4px 4px 0 #a8326a;pointer-events:none}
</style>
</head>
<body>
<div id="sakura"></div>
<canvas id="cv"></canvas>
<div id="hud"><div><div class="lbl">Ты</div><div class="big" id="myS">0</div></div>
<div class="mid"><div class="lbl">Время</div><div class="big" id="tm">60</div></div>
<div class="r" id="oppBox"><div class="lbl">Друг</div><div class="big" id="opS">0</div></div></div>
<div id="count"></div>
<div id="ui"></div>
<script>
/* ---------- оформление ---------- */
function kittySVG(cls=''){return `<svg class="${cls}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<path d="M18 48 L24 8 L48 30Z" fill="#ffb36b" stroke="#5b2346" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M82 48 L76 8 L52 30Z" fill="#ffb36b" stroke="#5b2346" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M26 36 L28 18 L40 30Z" fill="#ffb3c7"/><path d="M74 36 L72 18 L60 30Z" fill="#ffb3c7"/>
<ellipse cx="50" cy="57" rx="40" ry="33" fill="#ffb36b" stroke="#5b2346" stroke-width="2.5"/>
<path d="M44 26 Q45 33 43 38 M50 25 L50 37 M56 26 Q55 33 57 38" stroke="#e57f34" stroke-width="3.5" stroke-linecap="round" fill="none"/>
<path d="M12 56 Q19 55 22 59 M88 56 Q81 55 78 59" stroke="#e57f34" stroke-width="3" stroke-linecap="round" fill="none"/>
<ellipse cx="50" cy="73" rx="17" ry="12" fill="#fff1e3"/>
<ellipse cx="34" cy="55" rx="8" ry="9.5" fill="#3a1c33"/><ellipse cx="66" cy="55" rx="8" ry="9.5" fill="#3a1c33"/>
<circle cx="37" cy="51" r="3.2" fill="#fff"/><circle cx="69" cy="51" r="3.2" fill="#fff"/>
<circle cx="31.5" cy="59" r="1.6" fill="#fff"/><circle cx="63.5" cy="59" r="1.6" fill="#fff"/>
<ellipse cx="22" cy="67" rx="6" ry="3.5" fill="#ff8fb3" opacity=".7"/><ellipse cx="78" cy="67" rx="6" ry="3.5" fill="#ff8fb3" opacity=".7"/>
<path d="M46.5 65 L53.5 65 L50 69Z" fill="#ff6f9c" stroke="#5b2346" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M43 71 Q46.5 76 50 71 Q53.5 76 57 71" stroke="#5b2346" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M6 64 L28 68 M6 74 L28 72 M94 64 L72 68 M94 74 L72 72" stroke="#5b2346" stroke-width="1.5" stroke-linecap="round"/>
</svg>`}
(function decor(){
  const k=kittySVG().replace('<svg class=""','<svg x="10" y="12" width="64" height="64"');
  const pat=`<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220"><g opacity=".5">${k}</g>
   <text x="130" y="60" font-size="26">🍓</text><text x="150" y="170" font-size="22">💗</text><text x="40" y="180" font-size="24">🌸</text><text x="110" y="120" font-size="16">✨</text></svg>`;
  document.body.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(pat)}"),linear-gradient(160deg,#f3a7c8,#c95f8f)`;
  let h='';for(let i=0;i<30;i++){const d=8+Math.random()*9;
    h+=`<div class="petal" style="left:${Math.random()*100}%;animation-duration:${d}s;animation-delay:${-Math.random()*d}s"><i style="--s:${.6+Math.random()*.8};animation-duration:${1.5+Math.random()*2.5}s"></i></div>`}
  document.getElementById('sakura').innerHTML=h;
})();

/* ---------- игра ---------- */
const DUR=60,G=1.6;
const FRUITS=[['🍉','#ff4d6d'],['🍊','#ff9f1c'],['🍎','#e63946'],['🍋','#ffd60a'],['🍑','#ffb4a2'],['🍓','#ff006e'],['🍍','#ffc300'],['🥝','#80b918'],['🍇','#9d4edd'],['🍒','#d00000']];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,DPR,RAD;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);RAD=Math.max(30,Math.min(62,Math.min(W,H)*.075))}
addEventListener('resize',resize);resize();
const sprites={};
function sprite(e){if(sprites[e])return sprites[e];const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.font='100px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,70);return sprites[e]=c}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function schedule(seed){const R=rng(seed),list=[];let t=1;
  while(t<DUR-1.2){
    const n=t<12?1+(R()<.35):t<35?1+(R()*3|0):2+(R()*4|0);
    for(let i=0;i<n;i++){const x=.12+.76*R();
      list.push({t:t+i*.18*R(),x,vx:(.5-x)*.45+(R()-.5)*.15,vy:-(1.3+.28*R()),rot:(R()-.5)*6,
        bomb:R()<(t<8?0:t<30?.12:.18),f:R()*FRUITS.length|0});}
    t+=t<12?1.3+.5*R():t<40?.9+.5*R():.7+.4*R();
  }
  return list.sort((a,b)=>a.t-b.t)}

let mode='menu',items=[],next=0,live=[],halves=[],parts=[],pops=[],trail=[],start=0,score=0,stroke=0,strokeT=0,shake=0,flash=0,sched=[],lastSent=-1;
function begin(seed){
  sched=schedule(seed);next=0;live=[];halves=[];parts=[];pops=[];score=0;oppScore=0;oppFinal=null;
  document.getElementById('myS').textContent=0;document.getElementById('opS').textContent=0;
  document.getElementById('oppBox').style.visibility=duel?'visible':'hidden';
  hideUI();document.getElementById('hud').style.display='flex';
  mode='count';const c=document.getElementById('count');c.style.display='flex';let n=3;c.textContent=n;
  const iv=setInterval(()=>{n--;if(n>0)c.textContent=n;else{clearInterval(iv);c.textContent='Режь!';setTimeout(()=>c.style.display='none',600);
    mode='play';start=performance.now()}},800);
}
function posOf(o,el){const dt=el-o.t;return{x:(o.x+o.vx*dt)*W,y:(1.08+o.vy*dt+.5*G*dt*dt)*H,a:o.rot*dt,vx:o.vx*W,vy:(o.vy+G*dt)*H}}
function addScore(d){score=Math.max(0,score+d);document.getElementById('myS').textContent=score;
  if(duel&&score!==lastSent){lastSent=score;net({t:'score',s:score})}}
function slice(o,el){
  const p=posOf(o,el);o.dead=true;
  if(o.bomb){shake=.35;flash=.3;addScore(-5);pops.push({x:p.x,y:p.y,txt:'-5 💥',t:0,c:'#ff3b3b'});
    for(let i=0;i<18;i++)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*600,vy:(Math.random()-.5)*600,t:0,c:i%2?'#333':'#ff9f1c'});return}
  stroke++;strokeT=performance.now();addScore(1);
  const [e,col]=FRUITS[o.f];
  for(const s of[-1,1])halves.push({e,x:p.x,y:p.y,vx:p.vx+s*110,vy:p.vy-120,a:p.a,va:s*4,side:s,t:0});
  for(let i=0;i<10;i++)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*420,vy:(Math.random()-.8)*420,t:0,c:col});
}
function endStroke(){if(stroke>=3){const b=stroke;addScore(b);const last=trail[trail.length-1]||{x:W/2,y:H/2};
  pops.push({x:last.x,y:last.y,txt:`Комбо ×${b}! +${b}`,t:0,c:'#fff'})}stroke=0}
function segHit(ax,ay,bx,by,cx,cy,r){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1;let t=((cx-ax)*dx+(cy-ay)*dy)/l;t=Math.max(0,Math.min(1,t));
  const x=ax+t*dx-cx,y=ay+t*dy-cy;return x*x+y*y<r*r}

let down=false;
cv.addEventListener('pointerdown',e=>{down=true;trail=[{x:e.clientX,y:e.clientY,t:performance.now()}]});
cv.addEventListener('pointermove',e=>{if(!down||mode!=='play')return;const now=performance.now(),pt={x:e.clientX,y:e.clientY,t:now},last=trail[trail.length-1];trail.push(pt);
  if(!last)return;const el=(now-start)/1000;
  for(const o of live)if(!o.dead){const p=posOf(o,el);if(segHit(last.x,last.y,pt.x,pt.y,p.x,p.y,RAD*.9))slice(o,el)}});
addEventListener('pointerup',()=>{down=false;endStroke()});
addEventListener('pointercancel',()=>{down=false;endStroke()});

let prev=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  ctx.clearRect(0,0,W,H);
  if(mode==='play'||mode==='count'){ctx.fillStyle='rgba(80,15,50,.32)';ctx.fillRect(0,0,W,H)}
  ctx.save();
  if(shake>0){shake-=dt;ctx.translate((Math.random()-.5)*14,(Math.random()-.5)*14)}
  if(mode==='play'){
    const el=(now-start)/1000,left=Math.max(0,DUR-el);
    document.getElementById('tm').textContent=Math.ceil(left);
    while(next<sched.length&&sched[next].t<=el)live.push(sched[next++]);
    if(stroke&&now-strokeT>300&&!down)endStroke();
    for(const o of live){if(o.dead)continue;const p=posOf(o,el);
      if(el-o.t>.5&&p.y>H+RAD*2){o.dead=true;continue}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
      if(o.bomb){ctx.shadowColor='#ff3b3b';ctx.shadowBlur=18}
      ctx.drawImage(sprite(o.bomb?'💣':FRUITS[o.f][0]),-RAD,-RAD,RAD*2,RAD*2);ctx.restore()}
    live=live.filter(o=>!o.dead);
    if(left<=0)finish();
  }
  // половинки
  for(const h of halves){h.t+=dt;h.vy+=G*H*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.a+=h.va*dt;
    ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.a);ctx.beginPath();ctx.rect(h.side<0?-RAD:0,-RAD,RAD,RAD*2);ctx.clip();
    ctx.globalAlpha=Math.max(0,1-h.t/1.6);ctx.drawImage(sprite(h.e),-RAD,-RAD,RAD*2,RAD*2);ctx.restore()}
  halves=halves.filter(h=>h.y<H+RAD*2&&h.t<1.6);
  for(const p of parts){p.t+=dt;p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=Math.max(0,1-p.t/.7);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill()}
  ctx.globalAlpha=1;parts=parts.filter(p=>p.t<.7);
  for(const p of pops){p.t+=dt;ctx.globalAlpha=Math.max(0,1-p.t);ctx.font='bold 26px "Trebuchet MS",system-ui';ctx.textAlign='center';
    ctx.lineWidth=5;ctx.strokeStyle='#a8326a';ctx.strokeText(p.txt,p.x,p.y-p.t*50);ctx.fillStyle=p.c;ctx.fillText(p.txt,p.x,p.y-p.t*50)}
  ctx.globalAlpha=1;pops=pops.filter(p=>p.t<1);
  // след от пальца
  trail=trail.filter(p=>now-p.t<140);
  if(trail.length>1){ctx.lineCap='round';ctx.lineJoin='round';
    for(const [w,c] of[[12,'rgba(255,111,174,.45)'],[5,'#fff']]){ctx.lineWidth=w;ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);
      for(const p of trail)ctx.lineTo(p.x,p.y);ctx.stroke()}}
  ctx.restore();
  if(flash>0){flash-=dt;ctx.fillStyle=`rgba(255,40,40,${flash})`;ctx.fillRect(0,0,W,H)}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- экраны ---------- */
const ui=document.getElementById('ui');
function showUI(html){ui.innerHTML=`<div class="panel">${html}</div>`;ui.classList.remove('hide')}
function hideUI(){ui.classList.add('hide')}
function getBest(){try{return+localStorage.getItem('fr_best')||0}catch{return 0}}
function setBest(v){try{localStorage.setItem('fr_best',v)}catch{}}
let duel=false,isHost=false,code='',ws=null,oppScore=0,oppFinal=null,wins=[0,0],guestHere=false;

function menu(){mode='menu';document.getElementById('hud').style.display='none';
  showUI(`${kittySVG('kit')}<h1>Кошачий Фрукторез</h1><div class="small">Режь фрукты пальцем или мышкой. Бомбы не трогай! 3+ фрукта одним взмахом: комбо.</div>
  <button id="duel">⚔️ Дуэль с другом</button><button class="alt" id="solo">🍉 Играть одному</button><div class="small">Рекорд: ${getBest()}</div>`);
  document.getElementById('solo').onclick=()=>{duel=false;begin(Math.random()*1e9|0)};
  document.getElementById('duel').onclick=hostDuel}
function finish(){
  mode='over';document.getElementById('hud').style.display='none';
  const rec=score>getBest();if(rec)setBest(score);
  if(!duel){showUI(`${kittySVG('kit')}<div class="small">Твой счёт</div><div class="res">${score}</div><div class="small">${rec?'Новый рекорд! 🎉':'Рекорд: '+getBest()}</div>
    <button id="again">Ещё раз</button><button class="alt" id="back">В меню</button>`);
    document.getElementById('again').onclick=()=>begin(Math.random()*1e9|0);document.getElementById('back').onclick=menu;return}
  net({t:'final',s:score});duelResult()}
function duelResult(){
  if(mode!=='over')return;
  if(oppFinal===null){showUI(`${kittySVG('kit')}<div class="small">Твой счёт</div><div class="res">${score}</div><div class="small">Ждём результат друга…</div>`);return}
  if(!duelResult.counted){duelResult.counted=true;if(score>oppFinal)wins[0]++;else if(oppFinal>score)wins[1]++}
  const t=score>oppFinal?'Ты победил! 🏆':score<oppFinal?'Друг победил 😿':'Ничья! 🤝';
  showUI(`${kittySVG('kit')}<h1>${t}</h1><div class="vs"><span>Ты<div>${score}</div></span><span>Друг<div>${oppFinal}</div></span></div>
   <div class="small">Счёт серии: <b>${wins[0]} : ${wins[1]}</b></div><button id="re">Реванш ⚔️</button><button class="alt" id="back">Выйти</button>`);
  document.getElementById('re').onclick=()=>{if(isHost)startDuel();else{net({t:'rematch'});document.getElementById('re').textContent='Ждём хозяина…'}};
  document.getElementById('back').onclick=()=>location.href=location.pathname}
function startDuel(){const seed=Math.random()*1e9|0;duelResult.counted=false;net({t:'start',seed});begin(seed)}

/* ---------- сеть (свой сервер на Cloudflare) ---------- */
function net(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(role,onOpen){
  ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws?room='+code+'&role='+role);
  ws.onopen=onOpen;
  ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}
    if((d.t==='join'||d.t==='hello')&&isHost){guestHere=true;if(mode==='menu'||mode==='wait')hostReady()}
    else if(d.t==='start'&&!isHost){duelResult.counted=false;begin(d.seed)}
    else if(d.t==='score'){oppScore=d.s;document.getElementById('opS').textContent=d.s}
    else if(d.t==='final'){oppFinal=d.s;document.getElementById('opS').textContent=d.s;duelResult()}
    else if(d.t==='rematch'&&isHost&&mode==='over')startDuel()
    else if(d.t==='left'){guestHere=false;showUI(`${kittySVG('kit')}<h1>Друг вышел 💔</h1><button onclick="location.href=location.pathname">В меню</button>`);mode='menu'}};
  ws.onerror=()=>showUI(`${kittySVG('kit')}<div>Нет связи с сервером 😿</div><button onclick="location.reload()">Обновить</button>`);
  setInterval(()=>net({t:'ping'}),25000)}
function hostDuel(){duel=true;isHost=true;code=Math.random().toString(36).slice(2,8);history.replaceState(null,'','#'+code);mode='wait';
  connect('host',()=>{const link=location.href;
    showUI(`${kittySVG('kit')}<h1>Дуэль</h1><div class="small">Отправь другу ссылку:</div><input id="lnk" readonly value="${link}">
    <button id="cp">Скопировать</button>${navigator.share?'<button class="alt" id="sh">Поделиться</button>':''}<div class="small" id="st">Ждём друга… ✨</div>`);
    document.getElementById('cp').onclick=()=>{document.getElementById('lnk').select();navigator.clipboard?.writeText(link);document.getElementById('cp').textContent='Скопировано 💗'};
    const sh=document.getElementById('sh');if(sh)sh.onclick=()=>navigator.share({title:'Кто нарежет больше фруктов?',url:link});
    if(guestHere)hostReady()})}
function hostReady(){showUI(`${kittySVG('kit')}<h1>Друг здесь! 🎉</h1><div class="small">60 секунд, одинаковые фрукты у обоих. Кто больше нарежет, тот и победил.</div><button id="go">Старт!</button>`);
  document.getElementById('go').onclick=startDuel}
function joinDuel(c){duel=true;isHost=false;code=c;mode='wait';showUI(`${kittySVG('kit')}<div>Подключаюсь…</div>`);
  connect('guest',()=>{net({t:'hello'});showUI(`${kittySVG('kit')}<h1>Ты в дуэли! ⚔️</h1><div class="small">Ждём, пока друг нажмёт «Старт».<br>60 секунд, кто больше нарежет, тот победил.</div>`)})}

const h=location.hash.slice(1);
if(/^[a-z0-9]{4,12}$/.test(h))joinDuel(h);else menu();
</script>
</body>
</html>
